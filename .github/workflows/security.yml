name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "37 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep ce
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]' && github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Semgrep
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF" --depth=1
            BASE_SHA="$(git merge-base HEAD "origin/$BASE_REF")"
            semgrep scan --config auto --error --baseline-commit "$BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            semgrep scan --config auto --error --baseline-commit "$BEFORE_SHA"
          else
            semgrep scan --config auto --error
          fi

  trivy:
    name: trivy fs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,dist,.git,public/release
