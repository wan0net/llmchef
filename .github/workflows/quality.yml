name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-smoke:
    name: runner smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            launcher_set: posix
          - name: macos
            os: macos-15
            launcher_set: posix
          - name: windows
            os: windows-2022
            launcher_set: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Ruby zip dependency
        if: matrix.launcher_set == 'posix'
        run: gem install rubyzip

      - name: Runner smoke tests
        run: npm run test:runner-smoke -- --launcher-set=${{ matrix.launcher_set }}

  test:
    name: lint, test, build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version consistency
        run: npm run version:check

      - name: Lint changed TypeScript files
        run: npm run lint
        env:
          LLMCHEF_LINT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || format('{0}^', github.sha) }}

      - name: Lint repository
        run: npm run lint:all

      - name: Check architecture fitness
        run: npm run fitness:architecture

      - name: Test
        run: npm test -- --run

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build local release bundle
        run: npm run release:local

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Verify release artifacts
        run: npm run release:verify

      - name: Check bundle budget
        run: npm run budget

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e
