name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, test, build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed TypeScript files
        run: npm run lint
        env:
          LLMCHEF_LINT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || format('{0}^', github.sha) }}

      - name: Lint repository
        run: npm run lint:all

      - name: Test
        run: npm test -- --run

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run budget

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e
