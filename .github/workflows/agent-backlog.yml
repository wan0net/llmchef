name: Agent Backlog Gardener

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-backlog-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  backlog:
    name: Create follow-up issues
    runs-on: [self-hosted, linux, agentic-codex, codex-architect]
    if: >-
      !contains(github.event.issue.labels.*.name, 'agent:human-only') &&
      ((github.event_name == 'issue_comment' &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        contains(github.event.comment.body, '/agent backlog')) ||
       (github.event_name == 'issues' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'agent:approved' ||
         github.event.label.name == 'agent:backlog') &&
        contains(github.event.issue.labels.*.name, 'agent:approved') &&
        contains(github.event.issue.labels.*.name, 'agent:backlog')))
    env:
      CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-5.4' }}
      RUNNER_BACKEND: ${{ vars.AGENT_RUNNER_BACKEND || 'codex' }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TRIGGER_URL: ${{ github.event.comment.html_url || github.event.issue.html_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Capture issue context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json number,title,body,state,labels,url,author,assignees,milestone > /tmp/backlog-source-issue.json
          gh issue view "$ISSUE_NUMBER" --json comments --jq .comments > /tmp/backlog-source-comments.json

      - name: Run Codex backlog gardener
        run: |
          set -euo pipefail
          LABEL_SPEC="$GITHUB_WORKSPACE/.github/agent-labels.json"
          ALLOWED_LABELS_CSV="$(jq -r '[.labels[] | select(.allow_backlog_label) | .name] | join(",")' "$LABEL_SPEC")"
          ALLOWED_LABELS_DISPLAY="$(jq -r '[.labels[] | select(.allow_backlog_label) | .name] | join(", ")' "$LABEL_SPEC")"
          cat > /tmp/backlog-schema.json <<'SCHEMA'
          {
            "type": "object",
            "additionalProperties": false,
            "required": ["items"],
            "properties": {
              "items": {
                "type": "array",
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["title", "body", "labels", "reason"],
                  "properties": {
                    "title": { "type": "string" },
                    "body": { "type": "string" },
                    "labels": {
                      "type": "array",
                      "items": { "type": "string" }
                    },
                    "reason": { "type": "string" }
                  }
                }
              }
            }
          }
          SCHEMA
          cat > /tmp/backlog-prompt.md <<PROMPT
          You are the repository backlog gardener agent. Read /tmp/backlog-source-issue.json, /tmp/backlog-source-comments.json, and the repository context.

          Turn rough human comments and agent findings into useful GitHub issues.

          Hard rules:
          - Output only strict JSON matching this shape: {"items":[{"title":"...","body":"...","labels":["agent:developer"],"reason":"..."}]}
          - Create only concrete, actionable follow-up issues with clear scope and acceptance criteria.
          - Do not create duplicates of existing or already-suggested work in the source issue.
          - Do not include secrets, credentials, tokens, or sensitive values.
          - Do not create issues that perform production actions directly.
          - For risky, production-adjacent, release, deploy, DNS, credential, secret-rotation, billing, or destructive work, create tightly scoped planning, review, or implementation tickets with clear guardrails when enough information exists.
          - Use agent:human-only only when missing context, a human business decision, a secret value, external permission, destructive-action approval, or live production authority is required.
          - Do not include agent:approved on created issues; a maintainer must apply that label before any implementation workflow starts.
          - Allowed labels are only: ${ALLOWED_LABELS_DISPLAY}.
          - For normal implementation work, use labels ["agent:developer"].
          - For planning work, use labels ["agent:architect"].
          - For security review work, use labels ["agent:security"] only when the issue is about review or analysis, not performing production changes.
          - If an agent lacks the information or authority to proceed, create an item labelled ["agent:human-only"] and explain the human decision, secret, permission, approval, authority, or missing context needed.
          - If there is no concrete follow-up, return {"items":[]}.

          Each issue body must include:
          - Context
          - Scope
          - Acceptance criteria
          - Suggested validation
          - Source: the originating issue number or comment context
          PROMPT
          scripts/agent-runner.sh exec --backend "$RUNNER_BACKEND" --model "$CODEX_MODEL" --cwd "$GITHUB_WORKSPACE" --output-schema /tmp/backlog-schema.json --output-last-message /tmp/backlog-items.json --prompt-file /tmp/backlog-prompt.md

      - name: Create backlog issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LABEL_SPEC="$GITHUB_WORKSPACE/.github/agent-labels.json"
          ALLOWED_LABELS_JSON="$(jq -c '[.labels[] | select(.allow_backlog_label) | .name]' "$LABEL_SPEC")"
          jq -e '.items | type == "array"' /tmp/backlog-items.json >/dev/null

          jq -r '.labels[] | @base64' "$LABEL_SPEC" | while IFS= read -r encoded; do
            label="$(printf '%s' "$encoded" | base64 --decode)"
            name="$(jq -r '.name' <<<"$label")"
            color="$(jq -r '.color' <<<"$label")"
            description="$(jq -r '.description' <<<"$label")"
            gh label create "$name" --color "$color" --description "$description" --force >/dev/null 2>&1 || true
          done

          created=0
          : > /tmp/backlog-created.md
          : > /tmp/backlog-skipped.md

          jq -c '.items[]' /tmp/backlog-items.json | while IFS= read -r item; do
            title="$(jq -r '.title' <<<"$item")"
            body="$(jq -r '.body' <<<"$item")"
            reason="$(jq -r '.reason' <<<"$item")"

            if [ -z "$title" ] || [ "$title" = "null" ]; then
              printf -- '- Skipped item with empty title.\n' >> /tmp/backlog-skipped.md
              continue
            fi

            if gh issue list --state open --search "$title in:title" --json title --jq '.[].title' | grep -Fx -- "$title" >/dev/null; then
              printf -- '- Skipped duplicate: `%s`\n' "$title" >> /tmp/backlog-skipped.md
              continue
            fi

            labels="$(jq -r --argjson allowed "$ALLOWED_LABELS_JSON" '
              [ .labels[] | select($allowed | index(.)) ] | unique | join(",")
            ' <<<"$item")"

            if [ -z "$labels" ]; then
              labels="agent:human-only"
            fi

            if [[ ",$labels," == *",agent:human-only,"* ]]; then
              labels="agent:human-only"
            fi

            cat > /tmp/backlog-issue-body.md <<EOF
          ${body}

          ---

          Created by Backlog Gardener from #${ISSUE_NUMBER}.

          Reason:
          ${reason}
          EOF

            url="$(gh issue create --title "$title" --body-file /tmp/backlog-issue-body.md --label "$labels")"
            created=$((created + 1))
            printf -- '- %s\n' "$url" >> /tmp/backlog-created.md
          done

          {
            printf '## Backlog Gardener\n\n'
            printf '**Trigger:** %s\n\n' "$TRIGGER_URL"
            if [ -s /tmp/backlog-created.md ]; then
              printf 'Created follow-up issues:\n\n'
              cat /tmp/backlog-created.md
            else
              printf 'No follow-up issues were created.\n'
            fi
            if [ -s /tmp/backlog-skipped.md ]; then
              printf '\nSkipped items:\n\n'
              cat /tmp/backlog-skipped.md
            fi
          } > /tmp/backlog-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/backlog-comment.md
