name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  runner-smoke:
    name: runner smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            launcher_set: posix
          - name: macos
            os: macos-15
            launcher_set: posix
          - name: windows
            os: windows-2022
            launcher_set: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Ruby zip dependency
        if: matrix.launcher_set == 'posix'
        env:
          GEM_HOME: ${{ runner.temp }}/ruby-gems
          GEM_PATH: ${{ runner.temp }}/ruby-gems
        run: |
          gem install rubyzip --version 2.4.1 --no-document
          gem install webrick --version 1.9.1 --no-document
          gem install minitest --version 5.25.5 --no-document

      - name: Runner smoke tests
        env:
          GEM_HOME: ${{ runner.temp }}/ruby-gems
          GEM_PATH: ${{ runner.temp }}/ruby-gems
        run: npm run test:runner-smoke -- --launcher-set=${{ matrix.launcher_set }}

  build:
    name: build, verify, and package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        run: npm run version:check

      - name: Lint repository
        run: npm run lint:all

      - name: Check architecture fitness
        run: npm run fitness:architecture

      - name: Test
        run: npm test -- --run

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build local release bundle
        run: npm run release:local

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Verify release artifacts
        run: npm run release:verify

      - name: Check bundle budget
        run: npm run budget

      - name: Upload release bundles
        uses: actions/upload-artifact@v7
        with:
          name: llmchef-release-bundles-${{ steps.version.outputs.value }}
          path: |
            public/release/latest.zip
            public/release/llmchef-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

  deploy:
    name: deploy to GitHub Pages
    needs:
      - build
      - runner-smoke
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
