name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build:
    name: build, verify, and package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        run: npm run version:check

      - name: Lint repository
        run: npm run lint:all

      - name: Test
        run: npm test -- --run

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build local release bundle
        run: npm run release:local

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Verify release artifacts
        run: npm run release:verify

      - name: Check bundle budget
        run: npm run budget

      - name: Upload release bundles
        uses: actions/upload-artifact@v5
        with:
          name: llmchef-release-bundles-${{ steps.version.outputs.value }}
          path: |
            public/release/latest.zip
            public/release/llmchef-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
